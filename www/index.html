<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>今日のおみくじ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
  :root{
    --paper:#F6EFDD;
    --paper-deep:#E8D8AE;
    --card:#FBF6E9;
    --ink:#2A211B;
    --ink-soft:#6B5C48;
    --vermillion:#C13B3B;
    --vermillion-deep:#8C2020;
    --gold:#B8912F;
    --indigo:#33415C;
    --wood:#C7A567;
    --wood-deep:#9C7A40;
    --wood-dark:#7A5E30;
    --hole:#3A2C18;
    --focus:#33415C;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#1B1712;
      --paper-deep:#120E0B;
      --card:#211B14;
      --ink:#EFE3D2;
      --ink-soft:#B9A98D;
      --vermillion:#D96A55;
      --vermillion-deep:#A5341F;
      --gold:#D4AF5A;
      --indigo:#8B9DBE;
      --wood:#6E5636;
      --wood-deep:#4A3A22;
      --wood-dark:#2E2414;
      --hole:#0B0806;
      --focus:#D4AF5A;
    }
  }
  :root[data-theme="dark"]{
    --paper:#1B1712;
    --paper-deep:#120E0B;
    --card:#211B14;
    --ink:#EFE3D2;
    --ink-soft:#B9A98D;
    --vermillion:#D96A55;
    --vermillion-deep:#A5341F;
    --gold:#D4AF5A;
    --indigo:#8B9DBE;
    --wood:#6E5636;
    --wood-deep:#4A3A22;
    --wood-dark:#2E2414;
    --hole:#0B0806;
    --focus:#D4AF5A;
  }

  *{box-sizing:border-box;}
  [hidden]{ display:none !important; }
  html,body{ height:100%; }
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
    background:
      radial-gradient(ellipse at 50% -10%, color-mix(in srgb, var(--paper-deep) 55%, transparent), transparent 60%),
      var(--paper);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',sans-serif;
    transition:background-color .3s ease, color .3s ease;
  }

  .stage{
    width:100%;
    max-width:420px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:22px;
    animation:stageIn .6s ease both;
  }
  @keyframes stageIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  header{
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
  }
  .torii{ font-size:1.5rem; line-height:1; opacity:.85; }
  h1{
    font-family:'Shippori Mincho', 'Hiragino Mincho ProN', serif;
    font-weight:800;
    font-size:1.7rem;
    margin:2px 0 0;
    letter-spacing:.04em;
    text-wrap:balance;
  }
  .date{
    font-size:.8rem;
    color:var(--ink-soft);
    letter-spacing:.08em;
  }
  .profile{
    font-size:.72rem;
    color:var(--gold);
    letter-spacing:.1em;
  }
  .edit-link{
    background:none;
    border:none;
    color:var(--ink-soft);
    text-decoration:underline;
    text-underline-offset:2px;
    font:inherit;
    font-size:.7rem;
    cursor:pointer;
    padding:2px 0;
  }

  /* ---- Tab bar ---- */
  .tab-bar{
    display:flex;
    gap:6px;
    width:100%;
  }
  .tab-btn{
    flex:1 1 0;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    background:transparent;
    border:1px solid color-mix(in srgb, var(--wood-deep) 40%, transparent);
    border-radius:10px;
    padding:8px 4px;
    font:inherit;
    font-size:.65rem;
    color:var(--ink-soft);
    cursor:pointer;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .tab-btn .tab-icon{ font-size:1.05rem; }
  .tab-btn:focus-visible{ outline:3px solid var(--focus); outline-offset:2px; }
  .tab-btn[aria-pressed="true"]{
    background:var(--vermillion);
    color:#fff;
    border-color:var(--vermillion);
  }

  /* ---- Profile scene ---- */
  .form-card{
    width:100%;
    background:var(--card);
    border-radius:10px;
    padding:24px 22px;
    display:flex;
    flex-direction:column;
    gap:18px;
    box-shadow:0 12px 26px color-mix(in srgb, var(--ink) 16%, transparent);
    border:1px solid color-mix(in srgb, var(--wood-deep) 35%, transparent);
  }
  .field{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .field-label{
    font-size:.72rem;
    letter-spacing:.1em;
    color:var(--ink-soft);
    text-align:left;
  }
  input[type="date"]{
    font:inherit;
    font-size:.95rem;
    padding:10px 12px;
    border-radius:8px;
    border:1px solid color-mix(in srgb, var(--wood-deep) 60%, transparent);
    background:var(--paper);
    color:var(--ink);
    width:calc(100% - 60px);
    display:block;
    margin:0 auto;
  }
  input[type="date"]:focus-visible{ outline:3px solid var(--focus); outline-offset:2px; }
  .pill-group{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .pill{
    flex:1 1 auto;
    border:1px solid color-mix(in srgb, var(--wood-deep) 60%, transparent);
    background:transparent;
    color:var(--ink);
    padding:9px 10px;
    border-radius:999px;
    font:inherit;
    font-size:.85rem;
    cursor:pointer;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .pill:focus-visible{ outline:3px solid var(--focus); outline-offset:2px; }
  .pill[aria-pressed="true"]{
    background:var(--vermillion);
    border-color:var(--vermillion);
    color:#fff;
  }
  .primary-btn{
    background:var(--vermillion);
    color:#fff;
    border:none;
    padding:13px 20px;
    border-radius:8px;
    font:inherit;
    font-weight:700;
    font-size:.95rem;
    letter-spacing:.05em;
    cursor:pointer;
    transition:background .15s ease, opacity .15s ease;
  }
  .primary-btn:hover:not(:disabled){ background:var(--vermillion-deep); }
  .primary-btn:disabled{ opacity:.45; cursor:not-allowed; }
  .primary-btn:focus-visible{ outline:3px solid var(--focus); outline-offset:2px; }

  .secondary-btn{
    margin-top:14px;
    width:100%;
    background:transparent;
    border:1px solid var(--vermillion);
    color:var(--vermillion);
    padding:11px 18px;
    border-radius:8px;
    font:inherit;
    font-weight:700;
    font-size:.88rem;
    cursor:pointer;
    transition:background .15s ease;
  }
  .secondary-btn:hover{ background:color-mix(in srgb, var(--vermillion) 12%, transparent); }
  .secondary-btn:focus-visible{ outline:3px solid var(--focus); outline-offset:2px; }

  /* ---- Box scene ---- */
  #box-scene{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
  }
  .prompt{
    font-size:.95rem;
    color:var(--ink-soft);
    text-align:center;
  }
  .box-wrap{
    position:relative;
    width:170px;
    height:220px;
    display:flex;
    align-items:flex-end;
    justify-content:center;
  }
  .box-shadow{
    position:absolute;
    bottom:-6px;
    width:130px;
    height:22px;
    border-radius:50%;
    background:radial-gradient(ellipse, color-mix(in srgb, var(--ink) 35%, transparent), transparent 70%);
    filter:blur(1px);
  }
  .fortune-box{
    position:relative;
    width:140px;
    height:190px;
    border-radius:22px 22px 26px 26px;
    background:
      repeating-linear-gradient(90deg,
        color-mix(in srgb, var(--wood) 100%, transparent) 0px,
        color-mix(in srgb, var(--wood) 92%, black 4%) 6px,
        var(--wood) 12px),
      linear-gradient(180deg, var(--wood) 0%, var(--wood-deep) 100%);
    box-shadow:
      inset 0 3px 6px color-mix(in srgb, white 25%, transparent),
      inset 0 -10px 18px color-mix(in srgb, black 30%, transparent),
      0 10px 20px color-mix(in srgb, var(--ink) 25%, transparent);
    cursor:pointer;
    border:none;
    padding:0;
    font:inherit;
    color:inherit;
    outline-offset:4px;
  }
  .fortune-box:focus-visible{ outline:3px solid var(--focus); }
  .band{
    position:absolute;
    left:0; right:0;
    height:10px;
    background:linear-gradient(180deg, transparent, color-mix(in srgb, var(--wood-dark) 70%, transparent), transparent);
  }
  .band.b1{ top:36px; }
  .band.b2{ top:132px; }
  .hole{
    position:absolute;
    top:14px;
    left:50%;
    transform:translateX(-50%);
    width:34px;
    height:14px;
    border-radius:50%;
    background:radial-gradient(ellipse at 50% 40%, var(--hole), black 90%);
    box-shadow:inset 0 2px 4px rgba(0,0,0,.6);
  }
  .stick{
    position:absolute;
    top:14px;
    left:50%;
    width:14px;
    height:120px;
    margin-left:-7px;
    border-radius:3px 3px 2px 2px;
    background:linear-gradient(180deg, #EFE3C8, #D8C79C);
    box-shadow:0 2px 4px rgba(0,0,0,.3);
    transform:translateY(0);
    opacity:0;
    pointer-events:none;
  }
  .stick .tip{
    position:absolute;
    top:-22px; left:50%;
    transform:translateX(-50%);
    background:var(--vermillion);
    color:#fff;
    font-family:'Shippori Mincho', serif;
    font-size:.7rem;
    padding:3px 6px;
    border-radius:4px;
    white-space:nowrap;
    box-shadow:0 2px 4px rgba(0,0,0,.25);
  }

  .fortune-box.shaking{ animation:shake .55s ease; }
  @keyframes shake{
    0%,100%{ transform:rotate(0deg); }
    15%{ transform:rotate(-6deg); }
    30%{ transform:rotate(5deg); }
    45%{ transform:rotate(-5deg); }
    60%{ transform:rotate(4deg); }
    75%{ transform:rotate(-3deg); }
    90%{ transform:rotate(2deg); }
  }
  .stick.rise{
    animation:rise .7s cubic-bezier(.2,.8,.3,1) forwards;
  }
  @keyframes rise{
    0%{ opacity:0; transform:translateY(0) rotate(0deg); }
    20%{ opacity:1; }
    100%{ opacity:1; transform:translateY(-96px) rotate(-4deg); }
  }
  @media (prefers-reduced-motion: reduce){
    .fortune-box.shaking{ animation:none; }
    .stick.rise{ animation:none; opacity:1; transform:translateY(-96px) rotate(0deg); }
  }

  /* ---- Result & other full-width scenes ---- */
  .scene-panel{ width:100%; }
  .fade-in{ animation:fadeIn .5s ease both; }
  @keyframes fadeIn{ from{ opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  .slip{
    position:relative;
    width:100%;
    background:var(--card);
    border:1px solid color-mix(in srgb, var(--wood-deep) 40%, transparent);
    border-radius:6px;
    padding:26px 22px 22px;
    box-shadow:0 14px 30px color-mix(in srgb, var(--ink) 18%, transparent);
    overflow:hidden;
  }
  .slip::before{
    content:"";
    position:absolute;
    inset:8px;
    border:1px solid color-mix(in srgb, var(--gold) 55%, transparent);
    border-radius:3px;
    pointer-events:none;
  }
  .slip-number{
    font-size:.72rem;
    letter-spacing:.12em;
    color:var(--ink-soft);
    text-align:center;
  }
  .seal{
    margin:6px auto 4px;
    width:98px;
    height:98px;
    border-radius:50%;
    border:3px double var(--vermillion);
    color:var(--vermillion);
    display:flex;
    align-items:center;
    justify-content:center;
    transform:rotate(-6deg);
    animation:stamp .45s cubic-bezier(.3,1.6,.4,1) both;
    animation-delay:.15s;
  }
  @keyframes stamp{
    0%{ opacity:0; transform:rotate(-6deg) scale(1.6); }
    100%{ opacity:1; transform:rotate(-6deg) scale(1); }
  }
  @media (prefers-reduced-motion: reduce){
    .seal{ animation:none; }
  }
  .seal span{
    font-family:'Shippori Mincho', serif;
    font-weight:800;
    font-size:1.6rem;
    letter-spacing:.05em;
  }
  .overall-text{
    text-align:center;
    font-size:.92rem;
    color:var(--ink-soft);
    margin:2px 0 18px;
    padding:0 6px;
  }

  .rows{
    display:flex;
    flex-direction:column;
    gap:0;
    border-top:1px solid color-mix(in srgb, var(--ink) 12%, transparent);
  }
  .row{
    display:grid;
    grid-template-columns:64px 1fr;
    gap:10px;
    padding:10px 2px;
    border-bottom:1px solid color-mix(in srgb, var(--ink) 12%, transparent);
    align-items:baseline;
  }
  .row .label{
    font-family:'Shippori Mincho', serif;
    font-weight:600;
    font-size:.82rem;
    color:var(--indigo);
    letter-spacing:.06em;
  }
  .row .value{ font-size:.88rem; }
  .swatch{
    display:inline-block;
    width:.7em; height:.7em;
    border-radius:50%;
    margin-right:.4em;
    vertical-align:middle;
    box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--ink) 25%, transparent);
  }

  .advice{
    margin-top:16px;
    text-align:center;
    font-family:'Shippori Mincho', serif;
    font-size:1rem;
    color:var(--ink);
  }
  .advice::before{ content:"「"; color:var(--gold); }
  .advice::after{ content:"」"; color:var(--gold); }

  /* ---- History scene ---- */
  .stat-row{
    display:flex;
    justify-content:space-around;
    margin-bottom:4px;
  }
  .stat{ text-align:center; }
  .stat-num{
    font-family:'Shippori Mincho', serif;
    font-weight:800;
    font-size:1.5rem;
    color:var(--vermillion);
    line-height:1;
  }
  .stat-label{
    font-size:.66rem;
    color:var(--ink-soft);
    margin-top:4px;
  }
  .history-list{
    display:flex;
    flex-direction:column;
    gap:8px;
    max-height:52vh;
    overflow-y:auto;
  }
  .history-item{
    display:grid;
    grid-template-columns:auto auto 1fr;
    gap:10px;
    align-items:center;
    padding:10px 12px;
    border-radius:8px;
    background:color-mix(in srgb, var(--paper-deep) 45%, transparent);
  }
  .history-date{ font-size:.7rem; color:var(--ink-soft); white-space:nowrap; }
  .history-rank{
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    font-size:.85rem;
    color:var(--vermillion);
    white-space:nowrap;
  }
  .history-text{
    font-size:.76rem;
    color:var(--ink);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .empty-note{
    text-align:center;
    color:var(--ink-soft);
    font-size:.85rem;
    padding:22px 6px;
  }

  /* ---- Collection scene ---- */
  .collection-summary{
    text-align:center;
    font-size:.85rem;
    color:var(--ink-soft);
    margin:0 0 4px;
  }
  .charm-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:10px;
    max-height:56vh;
    overflow-y:auto;
    padding-right:2px;
  }
  .charm-cell{
    aspect-ratio:1;
    border-radius:12px;
    background:color-mix(in srgb, var(--paper-deep) 40%, transparent);
    border:1px solid color-mix(in srgb, var(--wood-deep) 35%, transparent);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    padding:6px;
    text-align:center;
  }
  .charm-cell.locked{ opacity:.4; filter:grayscale(1); }
  .charm-icon{ font-size:1.7rem; }
  .charm-name{ font-size:.6rem; color:var(--ink-soft); line-height:1.25; }

  /* ---- Theme scene ---- */
  .theme-grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:12px;
  }
  .theme-card{
    border-radius:14px;
    padding:16px 10px;
    text-align:center;
    cursor:pointer;
    border:2px solid transparent;
    font:inherit;
  }
  .theme-card.selected{ border-color:var(--gold); }
  .theme-card:focus-visible{ outline:3px solid var(--focus); outline-offset:2px; }
  .theme-name{
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    font-size:.85rem;
  }
  .theme-tagline{
    font-size:.62rem;
    margin-top:4px;
  }
  .settings-block{
    border-top:1px solid color-mix(in srgb, var(--ink) 12%, transparent);
    padding-top:16px;
    margin-top:16px;
  }
  .settings-label{
    font-size:.72rem;
    color:var(--ink-soft);
    margin:0 0 8px;
  }
  .toggle-btn{
    width:100%;
    background:transparent;
    border:1px solid color-mix(in srgb, var(--wood-deep) 60%, transparent);
    color:var(--ink);
    padding:11px 14px;
    border-radius:8px;
    font:inherit;
    font-size:.82rem;
    cursor:pointer;
  }
  .toggle-btn[aria-pressed="true"]{
    background:var(--vermillion);
    border-color:var(--vermillion);
    color:#fff;
  }
  .toggle-btn:focus-visible{ outline:3px solid var(--focus); outline-offset:2px; }

  footer{
    text-align:center;
    font-size:.7rem;
    color:var(--ink-soft);
    opacity:.75;
  }
  .already-note{
    text-align:center;
    font-size:.78rem;
    color:var(--ink-soft);
    margin-top:10px;
  }
</style>
</head>
<body>

<div class="stage">
  <header>
    <div class="torii" aria-hidden="true">⛩</div>
    <h1>今日のおみくじ</h1>
    <div class="date" id="date-label"></div>
    <div class="profile" id="profile-label"></div>
    <button type="button" class="edit-link" id="change-profile-btn" hidden>プロフィールを変更</button>
  </header>

  <nav class="tab-bar" id="tab-bar" aria-label="メニュー" hidden>
    <button type="button" class="tab-btn" data-tab="main" aria-pressed="true"><span class="tab-icon" aria-hidden="true">⛩</span>おみくじ</button>
    <button type="button" class="tab-btn" data-tab="history" aria-pressed="false"><span class="tab-icon" aria-hidden="true">📖</span>おみくじ帳</button>
    <button type="button" class="tab-btn" data-tab="collection" aria-pressed="false"><span class="tab-icon" aria-hidden="true">🎁</span>授与品</button>
    <button type="button" class="tab-btn" data-tab="theme" aria-pressed="false"><span class="tab-icon" aria-hidden="true">🎨</span>テーマ</button>
  </nav>

  <div id="profile-scene" hidden>
    <div class="form-card">
      <div class="field">
        <label class="field-label" for="birth-input">生年月日</label>
        <input type="date" id="birth-input" max="">
      </div>
      <div class="field">
        <span class="field-label">性別</span>
        <div class="pill-group" id="gender-group" role="radiogroup" aria-label="性別">
          <button type="button" class="pill" data-value="male" aria-pressed="false">男性</button>
          <button type="button" class="pill" data-value="female" aria-pressed="false">女性</button>
          <button type="button" class="pill" data-value="other" aria-pressed="false">その他</button>
        </div>
      </div>
      <div class="field">
        <span class="field-label">血液型</span>
        <div class="pill-group" id="blood-group" role="radiogroup" aria-label="血液型">
          <button type="button" class="pill" data-value="A" aria-pressed="false">A型</button>
          <button type="button" class="pill" data-value="B" aria-pressed="false">B型</button>
          <button type="button" class="pill" data-value="O" aria-pressed="false">O型</button>
          <button type="button" class="pill" data-value="AB" aria-pressed="false">AB型</button>
        </div>
      </div>
      <button type="button" class="primary-btn" id="profile-submit" disabled>おみくじを引く</button>
    </div>
  </div>

  <div id="box-scene" hidden>
    <p class="prompt">タップして今日の運勢を引きましょう</p>
    <div class="box-wrap">
      <div class="box-shadow" aria-hidden="true"></div>
      <button class="fortune-box" id="draw-btn" aria-label="おみくじを引く">
        <div class="band b1" aria-hidden="true"></div>
        <div class="band b2" aria-hidden="true"></div>
        <div class="hole" aria-hidden="true"></div>
        <div class="stick" id="stick" aria-hidden="true"><span class="tip" id="stick-num"></span></div>
      </button>
    </div>
  </div>

  <div id="result-scene" class="scene-panel" hidden></div>
  <div id="history-scene" class="scene-panel" hidden></div>
  <div id="collection-scene" class="scene-panel" hidden></div>
  <div id="theme-scene" class="scene-panel" hidden></div>

  <footer>これは娯楽目的の占いです</footer>
</div>

<script>
(function(){
  var dateEl = document.getElementById('date-label');
  var now = new Date();
  var y = now.getFullYear(), m = now.getMonth()+1, d = now.getDate();
  var weekdays = ['日','月','火','水','木','金','土'];
  dateEl.textContent = y + '年' + m + '月' + d + '日（' + weekdays[now.getDay()] + '）';
  var dateKey = y + '-' + String(m).padStart(2,'0') + '-' + String(d).padStart(2,'0');

  var PROFILE_KEY = 'omikuji-profile-v1';
  var THEME_KEY = 'omikuji-theme-v1';

  function hashString(str){
    var h = 1779033703 ^ str.length;
    for (var i=0; i<str.length; i++){
      h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    return function(){
      h = Math.imul(h ^ (h >>> 16), 2246822507);
      h = Math.imul(h ^ (h >>> 13), 3266489909);
      h ^= h >>> 16;
      return h >>> 0;
    };
  }
  function mulberry32(seed){
    var a = seed;
    return function(){
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function computeStreaks(history){
    var dates = history.map(function(h){ return h.date; });
    var longest = 0, run = 0, prev = null;
    for (var i=0;i<dates.length;i++){
      if (prev){
        var diffDays = Math.round((new Date(dates[i]+'T00:00:00') - new Date(prev+'T00:00:00'))/86400000);
        run = (diffDays === 1) ? run + 1 : 1;
      } else {
        run = 1;
      }
      if (run > longest) longest = run;
      prev = dates[i];
    }
    var current = 0;
    if (dates.length){
      var lastGap = Math.round((new Date(dateKey+'T00:00:00') - new Date(dates[dates.length-1]+'T00:00:00'))/86400000);
      if (lastGap <= 1){
        current = 1;
        for (var j=dates.length-1;j>0;j--){
          var gap = Math.round((new Date(dates[j]+'T00:00:00') - new Date(dates[j-1]+'T00:00:00'))/86400000);
          if (gap === 1) current += 1; else break;
        }
      }
    }
    return { current: current, longest: longest, total: dates.length };
  }

  /* ---------------- Share as image ---------------- */
  function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }
  function wrapText(ctx, text, x, y, maxWidth, lineHeight){
    var chars = text.split('');
    var line = '', lines = [];
    for (var i=0;i<chars.length;i++){
      var test = line + chars[i];
      if (ctx.measureText(test).width > maxWidth && line){
        lines.push(line);
        line = chars[i];
      } else {
        line = test;
      }
    }
    if (line) lines.push(line);
    lines.forEach(function(l, idx){ ctx.fillText(l, x, y + idx*lineHeight); });
    return lines.length;
  }
  function buildShareCanvas(result){
    var canvas = document.createElement('canvas');
    var W = 750, H = 1000;
    canvas.width = W; canvas.height = H;
    var ctx = canvas.getContext('2d');
    var theme = THEMES[currentTheme] || THEMES.shirogitsune;
    var pal = isDarkMode() ? theme.dark : theme.light;
    var pad = 40;

    ctx.fillStyle = pal.paper; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = pal.card;
    roundRect(ctx, pad, pad, W-pad*2, H-pad*2, 24); ctx.fill();
    ctx.strokeStyle = pal.gold; ctx.lineWidth = 2;
    roundRect(ctx, pad+16, pad+16, W-pad*2-32, H-pad*2-32, 16); ctx.stroke();

    ctx.textAlign = 'center';
    ctx.fillStyle = pal.inkSoft;
    ctx.font = '28px "Hiragino Mincho ProN", serif';
    ctx.fillText('第 ' + result.stickNumber + ' 番', W/2, pad+90);

    ctx.strokeStyle = pal.vermillion; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(W/2, pad+210, 90, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = pal.vermillion;
    ctx.font = 'bold 60px "Hiragino Mincho ProN", serif';
    ctx.fillText(result.rank, W/2, pad+230);

    ctx.fillStyle = pal.inkSoft;
    ctx.font = '26px "Hiragino Sans", sans-serif';
    var overallLines = wrapText(ctx, result.overall, W/2, pad+340, W-pad*2-80, 36);

    ctx.fillStyle = pal.ink;
    ctx.font = '30px "Hiragino Mincho ProN", serif';
    var adviceY = pad+340 + overallLines*36 + 60;
    ctx.fillText('「' + result.advice + '」', W/2, adviceY);

    ctx.textAlign = 'left';
    ctx.fillStyle = result.colorHex;
    ctx.beginPath(); ctx.arc(W/2-96, adviceY+80, 14, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = pal.ink; ctx.font = '24px "Hiragino Sans", sans-serif';
    ctx.fillText('ラッキーカラー：' + result.colorName, W/2-70, adviceY+88);
    ctx.fillText('ラッキーアイテム：' + result.item, W/2-70, adviceY+128);

    ctx.textAlign = 'center';
    ctx.fillStyle = pal.inkSoft;
    ctx.font = '22px "Hiragino Sans", sans-serif';
    ctx.fillText('⛩ 今日のおみくじ ・ ' + theme.name, W/2, H-pad-30);

    return canvas;
  }
  function fallbackShare(canvas){

  function shareResult(result){
    var canvas = buildShareCanvas(result);
    canvas.toBlob(function(blob){
      if (!blob) { fallbackShare(canvas); return; }
      var reader = new FileReader();
      reader.onloadend = function(){
        var base64 = String(reader.result).split(',')[1];
        var Filesystem = getPlugin('Filesystem');
        var Share = getPlugin('Share');
        if (Filesystem && Share){

              files: [res.uri],
              dialogTitle: '今日のおみくじをシェア'
            });
          }).catch(function(){ fallbackShare(canvas); });
        } else {
          fallbackShare(canvas);
        }
      };
      reader.readAsDataURL(blob);
    }, 'image/png');
  }

        var t = THEMES[id];
        var selected = id === currentTheme;
        return '<button type="button" class="theme-card' + (selected ? ' selected' : '') + '" data-theme-id="' + id + '" ' +
          'style="background:linear-gradient(135deg,' + t.light.paper + ',' + t.light.vermillion + ')">' +
          '<div class="theme-name" style="color:' + t.light.ink + '">' + t.name + (selected ? ' ✓' : '') + '</div>' +
          '<div class="theme-tagline" style="color:' + t.light.inkSoft + '">' + t.tagline + '</div>' +
        '</button>';
      }).join('') + '</div>' +
      '<div class="settings-block">' +
        '<p class="settings-label">毎日の通知</p>' +
        '<button type="button" class="toggle-btn" id="notify-toggle" aria-pressed="' + notifyEnabled + '">' +
          (notifyEnabled ? '通知：オン（毎朝9時にお知らせ）' : '通知：オフ（タップで有効化）') +
        '</button>' +
      '</div>' +
    '</div>';
    themeScene.innerHTML = html;
    Array.prototype.slice.call(themeScene.querySelectorAll('.theme-card')).forEach(function(btn){
      btn.addEventListener('click', function(){
        currentTheme = btn.getAttribute('data-theme-id');
        saveTheme(currentTheme);
        applyTheme(currentTheme);
        renderThemeScene();
      });
    });
    var notifyBtn = document.getElementById('notify-toggle');
    if (notifyBtn) notifyBtn.addEventListener('click', toggleNotify);
  }

  function wirePillGroup(group, onSelect){
    var buttons = Array.prototype.slice.call(group.querySelectorAll('.pill'));
    buttons.forEach(function(btn){
      btn.addEventListener('click', function(){
        buttons.forEach(function(b){ b.setAttribute('aria-pressed', 'false'); });
        btn.setAttribute('aria-pressed', 'true');
        onSelect(btn.getAttribute('data-value'));
      });
    });
    return buttons;
  }
  var genderButtons = wirePillGroup(genderGroup, function(v){ selectedGender = v; updateSubmitState(); });
  var bloodButtons = wirePillGroup(bloodGroup, function(v){ selectedBlood = v; updateSubmitState(); });
  birthInput.addEventListener('input', updateSubmitState);
  function updateSubmitState(){
    submitBtn.disabled = !(birthInput.value && selectedGender && selectedBlood);
  }

  function showProfileForm(existing){
    tabBar.hidden = true;
    profileScene.hidden = false;
    boxScene.hidden = true;
    resultScene.hidden = true;
    historyScene.hidden = true;
    collectionScene.hidden = true;
    themeScene.hidden = true;
    if (existing){
      birthInput.value = existing.year + '-' + String(existing.month).padStart(2,'0') + '-' + String(existing.day).padStart(2,'0');
      selectedGender = existing.gender;
      selectedBlood = existing.blood;
      genderButtons.forEach(function(b){ b.setAttribute('aria-pressed', b.getAttribute('data-value') === existing.gender ? 'true' : 'false'); });
      bloodButtons.forEach(function(b){ b.setAttribute('aria-pressed', b.getAttribute('data-value') === existing.blood ? 'true' : 'false'); });
    }
    updateSubmitState();
  }

  submitBtn.addEventListener('click', function(){
    if (!birthInput.value || !selectedGender || !selectedBlood) return;
    var parts = birthInput.value.split('-');
    var profile = { year:parseInt(parts[0],10), month:parseInt(parts[1],10), day:parseInt(parts[2],10), gender:selectedGender, blood:selectedBlood };
    saveProfile(profile);
    profileScene.hidden = true;
    initApp(profile);
  });

  changeBtn.addEventListener('click', function(){
    showProfileForm(loadProfile());
  });

  function initApp(profile){
    changeBtn.hidden = false;
    tabBar.hidden = false;
    setActiveTab('main');
    var birthSign = zodiacSign(profile.month, profile.day);
    var birthEra = eraAnimal(profile.year);
    profileLabel.textContent = birthSign + ' ・ ' + birthEra + '年生まれ ・ ' + GENDER_LABEL[profile.gender] + ' ・ ' + profile.blood + '型';

    var storageKey = 'omikuji-' + dateKey + '-' + profile.year + profile.month + profile.day + profile.gender + profile.blood;
    var seedFn = hashString(dateKey + '-' + profile.year + profile.month + profile.day + profile.gender + profile.blood);
    var rand = mulberry32(seedFn());
    function pick(arr){ return arr[Math.floor(rand() * arr.length)]; }
    function pickRank(){
      var total = RANKS.reduce(function(s,r){ return s+r.weight; }, 0);
      var x = rand() * total;
      for (var i=0;i<RANKS.length;i++){
        x -= RANKS[i].weight;
        if (x <= 0) return RANKS[i];
      }
      return RANKS[RANKS.length-1];
    }

    function draw(){
      var stickNumber = Math.floor(rand() * 100) + 1;
      var rank = pickRank();
      var color = pick(COLORS);
      return {
        stickNumber: stickNumber,
        rank: rank.name,
        overall: rank.text,
        love: pick(LOVE),
        work: pick(WORK),
        money: pick(MONEY),
        health: pick(HEALTH),
        bloodTrait: pick(BLOOD[profile.blood]),
        colorName: color[0],
        colorHex: color[1],
        item: pick(ITEMS),
        advice: pick(ADVICE)
      };
    }

    function row(label, value){
      return '<div class="row"><div class="label">' + label + '</div><div class="value">' + value + '</div></div>';
    }

    function renderResult(result, alreadyDrawn){
      mainViewIsResult = true;
      resultScene.innerHTML =
        '<div class="slip fade-in">' +
          '<div class="slip-number">第 ' + result.stickNumber + ' 番</div>' +
          '<div class="seal"><span>' + result.rank + '</span></div>' +
          '<p class="overall-text">' + result.overall + '</p>' +
          '<div class="rows">' +
            row('恋愛', result.love) +
            row('仕事', result.work) +
            row('金運', result.money) +
            row('健康', result.health) +
            row('血液型', result.bloodTrait) +
            row('色', '<span class="swatch" style="background:' + result.colorHex + '"></span>' + result.colorName) +
            row('小物', result.item) +
          '</div>' +
          '<p class="advice">' + result.advice + '</p>' +
          '<button type="button" class="secondary-btn" id="share-btn">結果をシェア</button>' +
        '</div>' +
        (alreadyDrawn ? '<p class="already-note">本日はすでに引いています</p>' : '');
      resultScene.hidden = false;
      boxScene.hidden = true;
      var shareBtn = document.getElementById('share-btn');
      if (shareBtn) shareBtn.addEventListener('click', function(){ shareResult(result); });
    }

    var saved = null;
    try { var raw = localStorage.getItem(storageKey); if (raw) saved = JSON.parse(raw); } catch (e) {}

    mainViewIsResult = false;
    boxScene.hidden = false;
    resultScene.hidden = true;

    if (saved){
      renderResult(saved, true);
    } else {
      var oldBtn = document.getElementById('draw-btn');
      var btn = oldBtn.cloneNode(true);
      oldBtn.parentNode.replaceChild(btn, oldBtn);
      btn.classList.remove('shaking');
      var stick = btn.querySelector('.stick');
      var stickNum = btn.querySelector('.tip');
      stick.style.opacity = '';
      stick.classList.remove('rise');
      var drawing = false;
      btn.addEventListener('click', function(){
        if (drawing) return;
        drawing = true;
        var result = draw();
        try { localStorage.setItem(storageKey, JSON.stringify(result)); } catch (e) {}
        addHistoryEntry({
          date: dateKey,
          rank: result.rank,
          overall: result.overall,
          item: result.item,
          colorName: result.colorName,
          colorHex: result.colorHex,
          advice: result.advice,
          stickNumber: result.stickNumber
        });
        stickNum.textContent = '第' + result.stickNumber + '番';
        btn.classList.add('shaking');
        setTimeout(function(){
          stick.style.opacity = '1';
          stick.classList.add('rise');
        }, 300);
        setTimeout(function(){
          renderResult(result, false);
        }, 1250);
      });
    }
  }

  var profile = loadProfile();
  if (profile){
    initApp(profile);
  } else {
    showProfileForm(null);
  }
})();
</script>
</body>
</html>
