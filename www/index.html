<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>おみくじライフ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
  :root{
    --paper:#F6EFDD;
    --paper-deep:#E8D8AE;
    --card:#FBF6E9;
    --ink:#2A211B;
    --ink-soft:#6B5C48;
    --vermillion:#C13B3B;
    --vermillion-deep:#8C2020;
    --gold:#B8912F;
    --indigo:#33415C;
    --wood:#C7A567;
    --wood-deep:#9C7A40;
    --wood-dark:#7A5E30;
    --hole:#3A2C18;
    --focus:#33415C;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#1B1712;
      --paper-deep:#120E0B;
      --card:#211B14;
      --ink:#EFE3D2;
      --ink-soft:#B9A98D;
      --vermillion:#D96A55;
      --vermillion-deep:#A5341F;
      --gold:#D4AF5A;
      --indigo:#8B9DBE;
      --wood:#6E5636;
      --wood-deep:#4A3A22;
      --wood-dark:#2E2414;
      --hole:#0B0806;
      --focus:#D4AF5A;
    }
  }
  :root[data-theme="dark"]{
    --paper:#1B1712;
    --paper-deep:#120E0B;
    --card:#211B14;
    --ink:#EFE3D2;
    --ink-soft:#B9A98D;
    --vermillion:#D96A55;
    --vermillion-deep:#A5341F;
    --gold:#D4AF5A;
    --indigo:#8B9DBE;
    --wood:#6E5636;
    --wood-deep:#4A3A22;
    --wood-dark:#2E2414;
    --hole:#0B0806;
    --focus:#D4AF5A;
  }

  *{box-sizing:border-box;}
  [hidden]{ display:none !important; }
  body{
    margin:0;
    min-height:100vh;
    padding:32px 16px;
    padding-top:max(32px, calc(env(safe-area-inset-top) + 20px));
    -webkit-touch-callout:none;
    -webkit-user-select:none;
    user-select:none;
    background:
      radial-gradient(ellipse at 50% -10%, color-mix(in srgb, var(--paper-deep) 55%, transparent), transparent 60%),
      var(--paper);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',sans-serif;
    transition:background-color .3s ease, color .3s ease;
  }

  .stage{
    position:relative;
    z-index:1;
    width:100%;
    max-width:420px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:22px;
    animation:stageIn .6s ease both;
  }

  .theme-deco{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
  }
  .theme-deco .deco-item{
    position:absolute;
  }
  @keyframes stageIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  header{
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
  }
  .torii{ font-size:1.5rem; line-height:1; opacity:.85; }
  h1{
    font-family:'Shippori Mincho', 'Hiragino Mincho ProN', serif;
    font-weight:800;
    font-size:1.7rem;
    margin:2px 0 0;
    letter-spacing:.04em;
    text-wrap:balance;
  }
  .date{
    font-size:.8rem;
    color:var(--ink-soft);
    letter-spacing:.08em;
  }
  .season-badge{
    font-size:.68rem;
    color:var(--vermillion);
    background:color-mix(in srgb, var(--vermillion) 12%, transparent);
    padding:4px 12px;
    border-radius:999px;
  }
  .profile{
    font-size:.72rem;
    color:var(--gold);
    letter-spacing:.1em;
  }
  .edit-link{
    background:none;
    border:none;
    color:var(--ink-soft);
    text-decoration:underline;
    text-underline-offset:2px;
    font:inherit;
    font-size:.7rem;
    cursor:pointer;
    padding:2px 0;
  }

  /* ---- Tab bar ---- */
  .tab-bar{
    display:flex;
    gap:5px;
    width:100%;
  }
  .tab-btn{
    flex:1 1 0;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    background:transparent;
    border:1px solid color-mix(in srgb, var(--wood-deep) 40%, transparent);
    border-radius:10px;
    padding:8px 2px;
    font:inherit;
    color:var(--ink-soft);
    cursor:pointer;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .tab-btn .tab-icon{ font-size:1rem; }
  .tab-btn .tab-label{ font-size:.6rem; line-height:1.15; }
  .tab-btn:focus-visible{ outline:3px solid var(--focus); outline-offset:2px; }
  .tab-btn[aria-pressed="true"]{
    background:var(--vermillion);
    color:#fff;
    border-color:var(--vermillion);
  }

  /* ---- Profile scene ---- */
  #profile-scene{
    margin-top:36px;
  }
  .form-card{
    width:100%;
    background:var(--card);
    border-radius:10px;
    padding:24px 22px;
    display:flex;
    flex-direction:column;
    gap:18px;
    box-shadow:0 12px 26px color-mix(in srgb, var(--ink) 16%, transparent);
    border:1px solid color-mix(in srgb, var(--wood-deep) 35%, transparent);
  }
  .field{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .field-label{
    font-size:.72rem;
    letter-spacing:.1em;
    color:var(--ink-soft);
    text-align:left;
  }
  input[type="date"]{
    font:inherit;
    font-size:.95rem;
    padding:10px 12px;
    border-radius:8px;
    border:1px solid color-mix(in srgb, var(--wood-deep) 60%, transparent);
    background:var(--paper);
    color:var(--ink);
    width:calc(100% - 60px);
    display:block;
    margin:0 auto;
  }
  input[type="date"]:focus-visible{ outline:3px solid var(--focus); outline-offset:2px; }
  .pill-group{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .pill{
    flex:1 1 auto;
    border:1px solid color-mix(in srgb, var(--wood-deep) 60%, transparent);
    background:transparent;
    color:var(--ink);
    padding:9px 10px;
    border-radius:999px;
    font:inherit;
    font-size:.85rem;
    cursor:pointer;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .pill:focus-visible{ outline:3px solid var(--focus); outline-offset:2px; }
  .pill[aria-pressed="true"]{
    background:var(--vermillion);
    border-color:var(--vermillion);
    color:#fff;
  }
  .primary-btn{
    background:var(--vermillion);
    color:#fff;
    border:none;
    padding:13px 20px;
    border-radius:8px;
    font:inherit;
    font-weight:700;
    font-size:.95rem;
    letter-spacing:.05em;
    cursor:pointer;
    transition:background .15s ease, opacity .15s ease;
  }
  .primary-btn:hover:not(:disabled){ background:var(--vermillion-deep); }
  .primary-btn:disabled{ opacity:.45; cursor:not-allowed; }
  .primary-btn:focus-visible{ outline:3px solid var(--focus); outline-offset:2px; }

  .secondary-btn{
    margin-top:12px;
    width:100%;
    background:transparent;
    border:1px solid var(--vermillion);
    color:var(--vermillion);
    padding:11px 18px;
    border-radius:8px;
    font:inherit;
    font-weight:700;
    font-size:.88rem;
    cursor:pointer;
    transition:background .15s ease, opacity .15s ease;
  }
  .secondary-btn:hover:not(:disabled){ background:color-mix(in srgb, var(--vermillion) 12%, transparent); }
  .secondary-btn:disabled{ opacity:.5; cursor:default; }
  .secondary-btn:focus-visible{ outline:3px solid var(--focus); outline-offset:2px; }

  /* ---- Box scene ---- */
  #box-scene{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
  }
  .prompt{
    font-size:.95rem;
    color:var(--ink-soft);
    text-align:center;
  }
  .box-wrap{
    position:relative;
    width:170px;
    height:220px;
    display:flex;
    align-items:flex-end;
    justify-content:center;
  }
  .box-shadow{
    position:absolute;
    bottom:-6px;
    width:130px;
    height:22px;
    border-radius:50%;
    background:radial-gradient(ellipse, color-mix(in srgb, var(--ink) 35%, transparent), transparent 70%);
    filter:blur(1px);
  }
  .fortune-box{
    position:relative;
    width:140px;
    height:190px;
    border-radius:22px 22px 26px 26px;
    background:
      repeating-linear-gradient(90deg,
        color-mix(in srgb, var(--wood) 100%, transparent) 0px,
        color-mix(in srgb, var(--wood) 92%, black 4%) 6px,
        var(--wood) 12px),
      linear-gradient(180deg, var(--wood) 0%, var(--wood-deep) 100%);
    box-shadow:
      inset 0 3px 6px color-mix(in srgb, white 25%, transparent),
      inset 0 -10px 18px color-mix(in srgb, black 30%, transparent),
      0 10px 20px color-mix(in srgb, var(--ink) 25%, transparent);
    cursor:pointer;
    border:none;
    padding:0;
    font:inherit;
    color:inherit;
    outline-offset:4px;
  }
  .fortune-box:focus-visible{ outline:3px solid var(--focus); }
  .band{
    position:absolute;
    left:0; right:0;
    height:10px;
    background:linear-gradient(180deg, transparent, color-mix(in srgb, var(--wood-dark) 70%, transparent), transparent);
  }
  .band.b1{ top:36px; }
  .band.b2{ top:132px; }
  .hole{
    position:absolute;
    top:14px;
    left:50%;
    transform:translateX(-50%);
    width:34px;
    height:14px;
    border-radius:50%;
    background:radial-gradient(ellipse at 50% 40%, var(--hole), black 90%);
    box-shadow:inset 0 2px 4px rgba(0,0,0,.6);
  }
  .stick{
    position:absolute;
    top:14px;
    left:50%;
    width:14px;
    height:120px;
    margin-left:-7px;
    border-radius:3px 3px 2px 2px;
    background:linear-gradient(180deg, #EFE3C8, #D8C79C);
    box-shadow:0 2px 4px rgba(0,0,0,.3);
    transform:translateY(0);
    opacity:0;
    pointer-events:none;
  }
  .stick .tip{
    position:absolute;
    top:-22px; left:50%;
    transform:translateX(-50%);
    background:var(--vermillion);
    color:#fff;
    font-family:'Shippori Mincho', serif;
    font-size:.7rem;
    padding:3px 6px;
    border-radius:4px;
    white-space:nowrap;
    box-shadow:0 2px 4px rgba(0,0,0,.25);
  }

  .fortune-box.shaking{ animation:shake .55s ease; }
  @keyframes shake{
    0%,100%{ transform:rotate(0deg); }
    15%{ transform:rotate(-6deg); }
    30%{ transform:rotate(5deg); }
    45%{ transform:rotate(-5deg); }
    60%{ transform:rotate(4deg); }
    75%{ transform:rotate(-3deg); }
    90%{ transform:rotate(2deg); }
  }
  .stick.rise{
    animation:rise .7s cubic-bezier(.2,.8,.3,1) forwards;
  }
  @keyframes rise{
    0%{ opacity:0; transform:translateY(0) rotate(0deg); }
    20%{ opacity:1; }
    100%{ opacity:1; transform:translateY(-96px) rotate(-4deg); }
  }
  @media (prefers-reduced-motion: reduce){
    .fortune-box.shaking{ animation:none; }
    .stick.rise{ animation:none; opacity:1; transform:translateY(-96px) rotate(0deg); }
  }

  /* ---- Result & other full-width scenes ---- */
  .scene-panel{ width:100%; }
  .fade-in{ animation:fadeIn .5s ease both; }
  @keyframes fadeIn{ from{ opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  .slip{
    position:relative;
    width:100%;
    background:var(--card);
    border:1px solid color-mix(in srgb, var(--wood-deep) 40%, transparent);
    border-radius:6px;
    padding:26px 22px 22px;
    box-shadow:0 14px 30px color-mix(in srgb, var(--ink) 18%, transparent);
    overflow:hidden;
  }
  .slip::before{
    content:"";
    position:absolute;
    inset:8px;
    border:1px solid color-mix(in srgb, var(--gold) 55%, transparent);
    border-radius:3px;
    pointer-events:none;
  }
  .slip-number{
    font-size:.72rem;
    letter-spacing:.12em;
    color:var(--ink-soft);
    text-align:center;
  }
  .seal{
    margin:6px auto 4px;
    width:98px;
    height:98px;
    border-radius:50%;
    border:3px double var(--vermillion);
    color:var(--vermillion);
    display:flex;
    align-items:center;
    justify-content:center;
    transform:rotate(-6deg);
    animation:stamp .45s cubic-bezier(.3,1.6,.4,1) both;
    animation-delay:.15s;
  }
  @keyframes stamp{
    0%{ opacity:0; transform:rotate(-6deg) scale(1.6); }
    100%{ opacity:1; transform:rotate(-6deg) scale(1); }
  }
  @media (prefers-reduced-motion: reduce){
    .seal{ animation:none; }
  }
  .seal span{
    font-family:'Shippori Mincho', serif;
    font-weight:800;
    font-size:1.4rem;
    letter-spacing:.05em;
  }
  .overall-text{
    text-align:center;
    font-size:.92rem;
    color:var(--ink-soft);
    margin:2px 0 18px;
    padding:0 6px;
  }
  .season-note{
    text-align:center;
    font-size:.76rem;
    color:var(--vermillion);
    margin:12px 0 0;
    padding:0 6px;
  }

  .rows{
    display:flex;
    flex-direction:column;
    gap:0;
    border-top:1px solid color-mix(in srgb, var(--ink) 12%, transparent);
  }
  .row{
    display:grid;
    grid-template-columns:64px 1fr;
    gap:10px;
    padding:10px 2px;
    border-bottom:1px solid color-mix(in srgb, var(--ink) 12%, transparent);
    align-items:baseline;
  }
  .row .label{
    font-family:'Shippori Mincho', serif;
    font-weight:600;
    font-size:.82rem;
    color:var(--indigo);
    letter-spacing:.06em;
  }
  .row .value{ font-size:.88rem; }
  .swatch{
    display:inline-block;
    width:.7em; height:.7em;
    border-radius:50%;
    margin-right:.4em;
    vertical-align:middle;
    box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--ink) 25%, transparent);
  }

  .advice{
    margin-top:16px;
    text-align:center;
    font-family:'Shippori Mincho', serif;
    font-size:1rem;
    color:var(--ink);
  }
  .advice::before{ content:"「"; color:var(--gold); }
  .advice::after{ content:"」"; color:var(--gold); }

  /* ---- History scene ---- */
  .stat-row{
    display:flex;
    justify-content:space-around;
    margin-bottom:4px;
  }
  .stat{ text-align:center; }
  .stat-num{
    font-family:'Shippori Mincho', serif;
    font-weight:800;
    font-size:1.5rem;
    color:var(--vermillion);
    line-height:1;
  }
  .stat-label{
    font-size:.66rem;
    color:var(--ink-soft);
    margin-top:4px;
  }
  .history-list{
    display:flex;
    flex-direction:column;
    gap:8px;
    max-height:52vh;
    overflow-y:auto;
  }
  .history-item{
    display:grid;
    grid-template-columns:auto auto 1fr;
    gap:10px;
    align-items:center;
    padding:10px 12px;
    border-radius:8px;
    background:color-mix(in srgb, var(--paper-deep) 45%, transparent);
  }
  .history-date{ font-size:.7rem; color:var(--ink-soft); white-space:nowrap; }
  .history-rank{
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    font-size:.85rem;
    color:var(--vermillion);
    white-space:nowrap;
  }
  .history-text{
    font-size:.76rem;
    color:var(--ink);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .empty-note{
    text-align:center;
    color:var(--ink-soft);
    font-size:.85rem;
    padding:22px 6px;
  }
  .month-summary{
    display:flex;
    flex-direction:column;
    gap:4px;
    margin:14px 0 4px;
    padding:12px 14px;
    border-radius:8px;
    background:color-mix(in srgb, var(--paper-deep) 35%, transparent);
  }
  .month-summary-title{
    font-size:.72rem;
    color:var(--ink-soft);
    margin:0 0 4px;
  }
  .month-summary-row{
    display:flex;
    justify-content:space-between;
    font-size:.78rem;
    color:var(--ink);
  }
  .month-summary-empty{
    font-size:.76rem;
    color:var(--ink-soft);
    margin:0;
  }

  /* ---- Celebration overlay ---- */
  .celebration-overlay{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:color-mix(in srgb, var(--ink) 45%, transparent);
    z-index:1000;
    padding:24px;
    animation:celebrationFadeIn .3s ease both;
  }
  .celebration-overlay.celebration-hide{ animation:celebrationFadeOut .35s ease both; }
  @keyframes celebrationFadeIn{ from{ opacity:0; } to{ opacity:1; } }
  @keyframes celebrationFadeOut{ from{ opacity:1; } to{ opacity:0; } }
  .celebration-card{
    background:var(--card);
    border:2px solid var(--gold);
    border-radius:16px;
    padding:30px 26px;
    text-align:center;
    font-family:'Shippori Mincho', serif;
    font-weight:800;
    font-size:1.1rem;
    color:var(--vermillion);
    box-shadow:0 20px 40px rgba(0,0,0,.35);
    max-width:320px;
    white-space:pre-line;
    line-height:1.5;
    animation:celebrationPop .4s cubic-bezier(.3,1.6,.4,1) both;
  }
  @keyframes celebrationPop{ from{ transform:scale(.7); opacity:0; } to{ transform:scale(1); opacity:1; } }

  /* ---- Collection scene ---- */
  .collection-summary{
    text-align:center;
    font-size:.85rem;
    color:var(--ink-soft);
    margin:0 0 4px;
  }
  .charm-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:10px;
    max-height:56vh;
    overflow-y:auto;
    padding-right:2px;
  }
  .charm-cell{
    aspect-ratio:1;
    border-radius:12px;
    background:color-mix(in srgb, var(--paper-deep) 40%, transparent);
    border:1px solid color-mix(in srgb, var(--wood-deep) 35%, transparent);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    padding:6px;
    text-align:center;
  }
  .charm-cell.locked{ opacity:.4; filter:grayscale(1); }
  .charm-icon{ font-size:1.7rem; }
  .charm-name{ font-size:.58rem; color:var(--ink-soft); line-height:1.25; }

  /* ---- Musubi (tying spot) scene ---- */
  .musubi-board{
    display:flex;
    flex-direction:column;
    gap:22px;
    max-height:52vh;
    overflow-y:auto;
    padding:4px 4px 10px;
  }
  .musubi-rope{
    height:13px;
    border-radius:7px;
    background:
      repeating-linear-gradient(115deg,
        color-mix(in srgb, var(--wood) 100%, transparent) 0px,
        color-mix(in srgb, var(--wood) 78%, black 12%) 3px,
        var(--wood) 6px),
      linear-gradient(180deg, var(--wood) 0%, var(--wood-deep) 100%);
    box-shadow:0 2px 4px color-mix(in srgb, var(--ink) 25%, transparent);
  }
  .musubi-row{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    column-gap:14px;
    row-gap:20px;
    padding-top:16px;
  }
  .paper-strip{
    width:26px;
    height:52px;
    background:var(--card);
    border:1px solid color-mix(in srgb, var(--wood-deep) 40%, transparent);
    border-radius:2px;
    position:relative;
    box-shadow:0 3px 6px color-mix(in srgb, var(--ink) 20%, transparent);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    padding-bottom:5px;
    transition:transform .15s ease;
  }
  .paper-strip.tie-pressing{
    transform:rotate(-3deg) scale(.97);
  }
  .paper-strip::before{
    content:"";
    position:absolute;
    top:16px; left:2px; right:2px;
    height:1px;
    background:color-mix(in srgb, var(--ink) 15%, transparent);
  }
  .paper-strip::after{
    content:"";
    position:absolute;
    top:-14px; left:50%;
    transform:translateX(-50%);
    width:2px; height:14px;
    background:color-mix(in srgb, var(--ink) 45%, transparent);
  }
  .paper-strip .tie-knot{
    position:absolute;
    top:-17px; left:50%;
    transform:translateX(-50%);
    width:6px; height:6px;
    border-radius:50%;
    background:color-mix(in srgb, var(--ink) 55%, transparent);
    box-shadow:0 0 0 2px color-mix(in srgb, var(--wood) 55%, transparent);
  }
  .knot-dot{
    position:absolute;
    top:6px; left:50%;
    transform:translateX(-50%);
    width:9px; height:9px;
    border-radius:50%;
    box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--ink) 25%, transparent);
  }
  .knot-rank{
    font-family:'Shippori Mincho', serif;
    font-size:.56rem;
    font-weight:700;
    color:var(--vermillion);
  }
  .musubi-tear-hint{
    text-align:center;
    font-size:.6rem;
    color:var(--ink-soft);
    opacity:.7;
    margin:2px 0 0;
  }
  @keyframes tearShake{
    0%,100%{ transform:rotate(0deg); }
    20%{ transform:rotate(-4deg); }
    45%{ transform:rotate(3deg); }
    70%{ transform:rotate(-2deg); }

  function renderThemeDeco(themeId){
    var container = document.getElementById('theme-deco');
    if (!container) return;
    var keys = THEME_DECO[themeId] || THEME_DECO.aki;
    var count = 16;
    var html = '';
    for (var i=0;i<count;i++){
      var key = keys[i % keys.length];
      var edge = i % 4;
      var left, top;
      if (edge === 0){ top = (Math.random()*12).toFixed(1); left = (Math.random()*100).toFixed(1); }
      else if (edge === 1){ top = (88 + Math.random()*12).toFixed(1); left = (Math.random()*100).toFixed(1); }
      else if (edge === 2){ left = (Math.random()*10).toFixed(1); top = (Math.random()*100).toFixed(1); }
      else { left = (90 + Math.random()*10).toFixed(1); top = (Math.random()*100).toFixed(1); }
      html += buildDecoItem(key, left, top);
    }
    if (themeId === 'fuyu'){
      var extraCount = 7;
      for (var j=0;j<extraCount;j++){
        var key2 = keys[(count+j) % keys.length];
        html += buildDecoItem(key2, (Math.random()*100).toFixed(1), (Math.random()*100).toFixed(1));

    }

  var audioCtx = null;
  function getAudioCtx(){
    if (!audioCtx){
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx) { try { audioCtx = new Ctx(); } catch(e){} }
    }
    return audioCtx;

  function createNoiseBuffer(ctx, duration){
    var size = Math.max(1, Math.floor(ctx.sampleRate * duration));
    var buffer = ctx.createBuffer(1, size, ctx.sampleRate);
    var data = buffer.getChannelData(0);
    for (var i=0;i<size;i++){ data[i] = Math.random()*2-1; }
    return buffer;
  }
  function playPaperRustle(){
    if (!soundEnabled) return;
    var ctx = getAudioCtx();
    if (!ctx) return;
    if (ctx.state === 'suspended') ctx.resume();
    var now = ctx.currentTime;
    var dur = 0.32;
    var noise = ctx.createBufferSource();
    noise.buffer = createNoiseBuffer(ctx, dur);
    var highpass = ctx.createBiquadFilter();
    highpass.type = 'highpass';
    highpass.frequency.value = 2200;
    var gain = ctx.createGain();
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.linearRampToValueAtTime(0.16, now + 0.04);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    noise.connect(highpass);
    highpass.connect(gain);
    gain.connect(ctx.destination);
    noise.start(now);
    noise.stop(now + dur + 0.02);
  }

  function loadBgmPref(){ try { return localStorage.getItem(BGM_KEY) === '1'; } catch(e){ return false; } }
  function saveBgmPref(v){ try { localStorage.setItem(BGM_KEY, v ? '1' : '0'); } catch(e){} }
  var bgmEnabled = loadBgmPref();
  var bgmAudio = document.getElementById('bgm-audio');
  var bgmFadeTimer = null;
  function fadeBgmVolume(target, duration){
    if (bgmFadeTimer) clearInterval(bgmFadeTimer);
    var steps = 20;
    var startVol = bgmAudio.volume;
    var diff = target - startVol;
    var count = 0;
    bgmFadeTimer = setInterval(function(){
      count++;
      bgmAudio.volume = Math.max(0, Math.min(1, startVol + diff * (count/steps)));
      if (count >= steps){
        clearInterval(bgmFadeTimer);
        bgmFadeTimer = null;
        if (target === 0) bgmAudio.pause();
      }
    }, duration/steps);
  }
  function startBgm(){
    bgmAudio.volume = 0;
    bgmAudio.play().catch(function(){});
    fadeBgmVolume(0.4, 1200);
  }
  function stopBgm(){
    fadeBgmVolume(0, 250);
  }
  function toggleBgm(){
    bgmEnabled = !bgmEnabled;
    saveBgmPref(bgmEnabled);
    if (bgmEnabled) startBgm(); else stopBgm();
    renderThemeScene();
  }
  function pauseBgmImmediately(){
    if (bgmFadeTimer) { clearInterval(bgmFadeTimer); bgmFadeTimer = null; }
    if (!bgmAudio.paused) bgmAudio.pause();
  }
  function resumeBgmIfEnabled(){
    if (bgmEnabled && bgmAudio.paused){
      if (bgmAudio.volume < 0.05) bgmAudio.volume = 0.4;
      bgmAudio.play().catch(function(){});
    }
  }
  document.addEventListener('visibilitychange', function(){
    if (document.hidden) pauseBgmImmediately(); else resumeBgmIfEnabled();
  });

  /* ---------------- Share as image ---------------- */
  function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }
  function wrapText(ctx, text, x, y, maxWidth, lineHeight){
    var chars = text.split('');
    var line = '', lines = [];
    for (var i=0;i<chars.length;i++){
      var test = line + chars[i];
      if (ctx.measureText(test).width > maxWidth && line){
        lines.push(line);
        line = chars[i];
      } else {
        line = test;
      }
    }
    if (line) lines.push(line);
    lines.forEach(function(l, idx){ ctx.fillText(l, x, y + idx*lineHeight); });
    return lines.length;
  }
  function buildShareCanvas(result){
    var canvas = document.createElement('canvas');
    var W = 750, H = 1000;
    canvas.width = W; canvas.height = H;
    var ctx = canvas.getContext('2d');
    var theme = THEMES[currentTheme] || THEMES.aki;
    var pal = isDarkMode() ? theme.dark : theme.light;
    var pad = 40;

    ctx.fillStyle = pal.paper; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = pal.card;
    roundRect(ctx, pad, pad, W-pad*2, H-pad*2, 24); ctx.fill();
    ctx.strokeStyle = pal.gold; ctx.lineWidth = 2;
    roundRect(ctx, pad+16, pad+16, W-pad*2-32, H-pad*2-32, 16); ctx.stroke();

    ctx.textAlign = 'center';
    ctx.fillStyle = pal.inkSoft;
    ctx.font = '28px "Hiragino Mincho ProN", serif';
    ctx.fillText(T().slipNumber(result.stickNumber), W/2, pad+90);

    ctx.strokeStyle = pal.vermillion; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(W/2, pad+210, 90, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = pal.vermillion;
    ctx.font = 'bold 56px "Hiragino Mincho ProN", serif';
    ctx.fillText(result.rank, W/2, pad+230);

    ctx.fillStyle = pal.inkSoft;
    ctx.font = '26px "Hiragino Sans", sans-serif';
    var overallLines = wrapText(ctx, result.overall, W/2, pad+340, W-pad*2-80, 36);

    ctx.fillStyle = pal.ink;
    ctx.font = '30px "Hiragino Mincho ProN", serif';
    var adviceY = pad+340 + overallLines*36 + 60;
    ctx.fillText('「' + result.advice + '」', W/2, adviceY);

    ctx.textAlign = 'left';
    ctx.fillStyle = result.colorHex;
    ctx.beginPath(); ctx.arc(W/2-96, adviceY+80, 14, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = pal.ink; ctx.font = '24px "Hiragino Sans", sans-serif';
    ctx.fillText(T().rowColor + '：' + result.colorName, W/2-70, adviceY+88);
    ctx.fillText(T().rowItem + '：' + result.item, W/2-70, adviceY+128);

    ctx.textAlign = 'center';
    ctx.fillStyle = pal.inkSoft;
    ctx.font = '22px "Hiragino Sans", sans-serif';
    ctx.fillText('⛩ ' + T().appTitle + ' ・ ' + theme.name[lang], W/2, H-pad-30);

    return canvas;
  }
  function fallbackShare(canvas){
    try {
      var url = canvas.toDataURL('image/png');
      var w = window.open();
      if (w) w.document.write('<img src="'+url+'" style="max-width:100%">');
    } catch(e){}
  }
  function shareResult(result){
    var canvas = buildShareCanvas(result);
    canvas.toBlob(function(blob){
      if (!blob) { fallbackShare(canvas); return; }
      var reader = new FileReader();
      reader.onloadend = function(){
        var base64 = String(reader.result).split(',')[1];
        var Filesystem = getPlugin('Filesystem');
        var Share = getPlugin('Share');
        if (Filesystem && Share){
          var fileName = 'omikuji-' + dateKey + '.png';
          Filesystem.writeFile({ path: fileName, data: base64, directory: 'CACHE' }).then(function(res){
            return Share.share({
              title: T().appTitle,
              text: result.rank + '「' + result.advice + '」',
              files: [res.uri],
              dialogTitle: T().shareDialogTitle
            });
          }).catch(function(){ fallbackShare(canvas); });
        } else {
          fallbackShare(canvas);
        }
      };
      reader.readAsDataURL(blob);
    }, 'image/png');
  }

  function computeStreaks(history){
    var dates = history.map(function(h){ return h.date; });
    var longest = 0, run = 0, prev = null;
    for (var i=0;i<dates.length;i++){
      if (prev){
        var diffDays = Math.round((new Date(dates[i]+'T00:00:00') - new Date(prev+'T00:00:00'))/86400000);
        run = (diffDays === 1) ? run + 1 : 1;
      } else {
        run = 1;
      }
      if (run > longest) longest = run;
      prev = dates[i];
    }
    var current = 0;
    if (dates.length){
      var lastGap = Math.round((new Date(dateKey+'T00:00:00') - new Date(dates[dates.length-1]+'T00:00:00'))/86400000);
      if (lastGap <= 1){
        current = 1;
        for (var j=dates.length-1;j>0;j--){
          var gap = Math.round((new Date(dates[j]+'T00:00:00') - new Date(dates[j-1]+'T00:00:00'))/86400000);
          if (gap === 1) current += 1; else break;
        }
      }
    }
    return { current: current, longest: longest, total: dates.length };
  }
  function computeCollection(history){
    var collectedIds = {};
    history.forEach(function(h){ if (h.itemId) collectedIds[h.itemId] = true; });
    return allCharmSlots(lang).map(function(slot){
      return { id: slot.id, name: slot.name, icon: slot.icon, collected: !!collectedIds[slot.id] };
    });
  }
  function computeMonthlySummary(history){
    var prefix = dateKey.slice(0,7);
    var counts = {};
    var total = 0;
    history.forEach(function(h){
      if (h.date.slice(0,7) === prefix && typeof h.rankIndex === 'number'){
        counts[h.rankIndex] = (counts[h.rankIndex] || 0) + 1;
        total += 1;
      }
    });
    return { total: total, counts: counts };
  }

  function tearPaperStrip(stripEl, date){
    var rect = stripEl.getBoundingClientRect();
    stripEl.classList.add('tie-tearing');
    hapticImpact('LIGHT');
    setTimeout(function(){
      stripEl.style.visibility = 'hidden';
      function makeHalf(side){
        var half = stripEl.cloneNode(true);
        half.classList.remove('tie-tearing');
        half.classList.add('tear-half', 'tear-' + side);
        half.style.position = 'fixed';
        half.style.left = rect.left + 'px';
        half.style.top = rect.top + 'px';
        half.style.width = rect.width + 'px';
        half.style.height = rect.height + 'px';
        half.style.margin = '0';
        document.body.appendChild(half);
        return half;
      }
      var left = makeHalf('left');
      var right = makeHalf('right');
      playPaperRustle();
      hapticImpact('MEDIUM');
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          left.classList.add('tear-pull');
          right.classList.add('tear-pull');
          setTimeout(function(){
            left.classList.add('tear-go');
            right.classList.add('tear-go');
          }, 110);
        });
      });
      setTimeout(function(){
        left.remove(); right.remove();
        untieDate(date);
      }, 110 + 670);
    }, 220);
  }
  function wireMusubiTear(){
    if (musubiScene.dataset.tearWired) return;
    musubiScene.dataset.tearWired = '1';
    var LONG_PRESS_MS = 500;
    var MOVE_TOLERANCE = 12;
    var pressTimer = null, pressEl = null;
    var startX = 0, startY = 0;
    function clearPress(){
      if (pressTimer){ clearTimeout(pressTimer); pressTimer = null; }
      if (pressEl){ pressEl.classList.remove('tie-pressing'); pressEl = null; }
    }
    musubiScene.addEventListener('pointerdown', function(e){
      var strip = e.target.closest && e.target.closest('.paper-strip');
      if (!strip) return;
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      startX = e.clientX; startY = e.clientY;
      clearPress();
      pressEl = strip;
      pressEl.classList.add('tie-pressing');
      pressTimer = setTimeout(function(){
        pressTimer = null;
        var el = pressEl; pressEl = null;
        if (el){ el.classList.remove('tie-pressing'); tearPaperStrip(el, el.dataset.date); }
      }, LONG_PRESS_MS);
    });
    musubiScene.addEventListener('pointermove', function(e){
      if (!pressTimer) return;
      if (Math.abs(e.clientX - startX) > MOVE_TOLERANCE || Math.abs(e.clientY - startY) > MOVE_TOLERANCE) clearPress();
    });
    musubiScene.addEventListener('pointerup', clearPress);
    musubiScene.addEventListener('pointercancel', clearPress);
    musubiScene.addEventListener('pointerleave', clearPress);
    musubiScene.addEventListener('contextmenu', function(e){ if (e.target.closest && e.target.closest('.paper-strip')) e.preventDefault(); });
  }

      btn.textContent = S.genderLabels[btn.getAttribute('data-value')];
    });
    Array.prototype.slice.call(bloodGroup.querySelectorAll('.pill')).forEach(function(btn){
      btn.textContent = bloodDisplay(btn.getAttribute('data-value'));
    });
    var tabLabelMap = { main:S.tabMain, history:S.tabHistory, collection:S.tabCollection, musubi:S.tabMusubi, theme:S.tabTheme };
    Array.prototype.slice.call(tabBar.querySelectorAll('.tab-btn')).forEach(function(btn){
      var label = btn.querySelector('.tab-label');
      if (label) label.textContent = tabLabelMap[btn.getAttribute('data-tab')];
    });
    if (currentProfile) profileLabel.textContent = formatProfileLabel(currentProfile);
    if (!historyScene.hidden) renderHistoryScene();
    else if (!collectionScene.hidden) renderCollectionScene();
    else if (!musubiScene.hidden) renderMusubiScene();
    else if (!themeScene.hidden) renderThemeScene();
    else if (!resultScene.hidden && refreshResultLabels) refreshResultLabels();
  }

  function wirePillGroup(group, onSelect){
    var buttons = Array.prototype.slice.call(group.querySelectorAll('.pill'));
    buttons.forEach(function(btn){
      btn.addEventListener('click', function(){
        buttons.forEach(function(b){ b.setAttribute('aria-pressed', 'false'); });
        btn.setAttribute('aria-pressed', 'true');
        onSelect(btn.getAttribute('data-value'));
      });
    });
    return buttons;
  }
  var genderButtons = wirePillGroup(genderGroup, function(v){ selectedGender = v; updateSubmitState(); });
  var bloodButtons = wirePillGroup(bloodGroup, function(v){ selectedBlood = v; updateSubmitState(); });
  birthInput.addEventListener('input', updateSubmitState);
  function updateSubmitState(){
    submitBtn.disabled = !(birthInput.value && selectedGender && selectedBlood);
  }

  function showProfileForm(existing){
    tabBar.hidden = true;
    profileScene.hidden = false;
    boxScene.hidden = true;
    resultScene.hidden = true;
    historyScene.hidden = true;
    collectionScene.hidden = true;
    musubiScene.hidden = true;
    themeScene.hidden = true;
    if (existing){
      birthInput.value = existing.year + '-' + String(existing.month).padStart(2,'0') + '-' + String(existing.day).padStart(2,'0');
      selectedGender = existing.gender;
      selectedBlood = existing.blood;
      genderButtons.forEach(function(b){ b.setAttribute('aria-pressed', b.getAttribute('data-value') === existing.gender ? 'true' : 'false'); });
      bloodButtons.forEach(function(b){ b.setAttribute('aria-pressed', b.getAttribute('data-value') === existing.blood ? 'true' : 'false'); });
    }
    updateSubmitState();
  }

  submitBtn.addEventListener('click', function(){
    if (!birthInput.value || !selectedGender || !selectedBlood) return;
    var parts = birthInput.value.split('-');
    var profile = { year:parseInt(parts[0],10), month:parseInt(parts[1],10), day:parseInt(parts[2],10), gender:selectedGender, blood:selectedBlood };
    saveProfile(profile);
    profileScene.hidden = true;
    initApp(profile);
  });

  changeBtn.addEventListener('click', function(){
    showProfileForm(loadProfile());
  });

  function initApp(profile){
    currentProfile = profile;
    changeBtn.hidden = false;
    tabBar.hidden = false;
    setActiveTab('main');
    profileLabel.textContent = formatProfileLabel(profile);

    var storageKey = 'omikuji-' + dateKey + '-' + profile.year + profile.month + profile.day + profile.gender + profile.blood;
    var seedFn = hashString(dateKey + '-' + profile.year + profile.month + profile.day + profile.gender + profile.blood);
    var rand = mulberry32(seedFn());
    function pick(arr){ return arr[Math.floor(rand() * arr.length)]; }
    function pickRankIndex(){
      var ranks = RANKS[lang];
      var total = ranks.reduce(function(s,r){ return s+r.weight; }, 0);
      var x = rand() * total;
      for (var i=0;i<ranks.length;i++){
        x -= ranks[i].weight;
        if (x <= 0) return i;
      }
      return ranks.length-1;
    }

    function draw(){
      var stickNumber = Math.floor(rand() * 100) + 1;
      var rankIdx = pickRankIndex();
      var rank = RANKS[lang][rankIdx];
      var colorIdx = Math.floor(rand() * COLOR_HEXES.length);
      var benefitIdx = Math.floor(rand() * CHARM_BENEFIT_NAMES.ja.length);
      var typeIdx = Math.floor(rand() * CHARM_TYPE_SUFFIX.ja.length);
      return {
        stickNumber: stickNumber,
        rank: rank.name,
        rankIndex: rankIdx,
        overall: rank.text,
        love: pick(LOVE[lang]),
        work: pick(WORK[lang]),
        money: pick(MONEY[lang]),
        health: pick(HEALTH[lang]),
        bloodTrait: pick(BLOOD[lang][profile.blood]),
        colorName: COLOR_NAMES[lang][colorIdx],
        colorHex: COLOR_HEXES[colorIdx],
        item: buildItemName(lang, benefitIdx, typeIdx),
        itemId: benefitIdx + '_' + typeIdx,
        advice: pick(ADVICE[lang])
      };
    }

    function row(label, value){
      return '<div class="row"><div class="label">' + label + '</div><div class="value">' + value + '</div></div>';
    }

    function renderResult(result, alreadyDrawn){
      mainViewIsResult = true;
      lastResult = result;
      lastAlreadyDrawn = alreadyDrawn;
      var S = T();
      var tied = isTiedToday();
      resultScene.innerHTML =
        '<div class="slip fade-in">' +
          '<div class="slip-number">' + S.slipNumber(result.stickNumber) + '</div>' +
          '<div class="seal"><span>' + result.rank + '</span></div>' +
          '<p class="overall-text">' + result.overall + '</p>' +
          '<div class="rows">' +
            row(S.rowLove, result.love) +
            row(S.rowWork, result.work) +
            row(S.rowMoney, result.money) +
            row(S.rowHealth, result.health) +
            row(S.rowBlood, result.bloodTrait) +
            row(S.rowColor, '<span class="swatch" style="background:' + result.colorHex + '"></span>' + result.colorName) +
            row(S.rowItem, result.item) +
          '</div>' +
          '<p class="advice">' + result.advice + '</p>' +
          (activeEvent ? '<p class="season-note">' + activeEvent.emoji + ' ' + activeEvent.name[lang] + '：' + activeEvent.note[lang] + '</p>' : '') +
          '<button type="button" class="secondary-btn" id="share-btn">' + S.shareBtn + '</button>' +
          '<button type="button" class="secondary-btn" id="tie-btn"' + (tied ? ' disabled' : '') + '>' + (tied ? S.tiedBtn : S.tieBtn) + '</button>' +
        '</div>' +
        (alreadyDrawn ? '<p class="already-note">' + S.alreadyNote + '</p>' : '');
      resultScene.hidden = false;
      boxScene.hidden = true;
      var shareBtn = document.getElementById('share-btn');
      if (shareBtn) shareBtn.addEventListener('click', function(){ shareResult(result); });
      var tieBtn = document.getElementById('tie-btn');
      if (tieBtn) tieBtn.addEventListener('click', function(){
        setTiedForToday(true);
        playPaperRustle();
        hapticForTie();
        tieBtn.textContent = T().tiedBtn;
        tieBtn.disabled = true;
      });
      refreshResultLabels = function(){ renderResult(result, alreadyDrawn); };
    }

    var saved = null;
    try { var raw = localStorage.getItem(storageKey); if (raw) saved = JSON.parse(raw); } catch (e) {}

    mainViewIsResult = false;
    boxScene.hidden = false;
    resultScene.hidden = true;

    if (saved){
      renderResult(saved, true);
    } else {
      var oldBtn = document.getElementById('draw-btn');
      var btn = oldBtn.cloneNode(true);
      oldBtn.parentNode.replaceChild(btn, oldBtn);
      btn.classList.remove('shaking');
      var stick = btn.querySelector('.stick');
      var stickNum = btn.querySelector('.tip');
      stick.style.opacity = '';
      stick.classList.remove('rise');
      var drawing = false;
      btn.addEventListener('click', function(){
        if (drawing) return;
        drawing = true;
        playDrawSound();
        hapticForDraw();
        var result = draw();
        try { localStorage.setItem(storageKey, JSON.stringify(result)); } catch (e) {}
        addHistoryEntry({
          date: dateKey,
          rank: result.rank,
          rankIndex: result.rankIndex,
          overall: result.overall,
          item: result.item,
          itemId: result.itemId,
          colorName: result.colorName,
          colorHex: result.colorHex,
          advice: result.advice,
          stickNumber: result.stickNumber
        });
        var milestones = checkMilestones();
        stickNum.textContent = '#' + result.stickNumber;
        btn.classList.add('shaking');
        setTimeout(function(){
          stick.style.opacity = '1';
          stick.classList.add('rise');
        }, 300);
        setTimeout(function(){
          playRankSound(result.rankIndex);
          hapticForRank(result.rankIndex);
          renderResult(result, false);
          if (milestones.length){
            setTimeout(function(){ showCelebration(milestones[0]); }, 600);
          }
        }, 1250);
      });
    }
  }

  function hashString(str){
    var h = 1779033703 ^ str.length;
    for (var i=0; i<str.length; i++){
      h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    return function(){
      h = Math.imul(h ^ (h >>> 16), 2246822507);
      h = Math.imul(h ^ (h >>> 13), 3266489909);
      h ^= h >>> 16;
      return h >>> 0;
    };
  }
  function mulberry32(seed){
    var a = seed;
    return function(){
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  applyLanguage();
  if (bgmEnabled){
    document.addEventListener('click', function resumeBgmOnce(){
      startBgm();
      document.removeEventListener('click', resumeBgmOnce);
    }, { once: true });
  }
  var profile = loadProfile();
  if (profile){
    initApp(profile);
  } else {
    showProfileForm(null);
  }
})();
</script>
</body>
</html>
